# Déploiement du service de compilation (Coolify ou docker compose).
# Les valeurs se règlent dans les variables d'environnement de Coolify,
# jamais dans ce fichier.
#
# Variables obligatoires : ADMIN_TOKEN, POSTGRES_PASSWORD, MASTER_KEY, ADMIN_EMAIL et
# ADMIN_PASSWORD (premier compte de l'interface /admin).
#
# Les sites s'enregistrent dans l'interface (/admin) et reçoivent leur clé par un code
# d'appairage. SITES_YAML reste accepté pour la transition (facultatif) : ses sites
# s'importent dans la base depuis l'interface, puis la variable peut être vidée.

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: page_compiler
      POSTGRES_USER: page_compiler
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U page_compiler -d page_compiler"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    command: ["node", "src/api/start.js"]
    environment:
      REDIS_URL: redis://redis:6379
      PORT: "3000"
      DATABASE_URL: postgres://page_compiler:${POSTGRES_PASSWORD:?}@postgres:5432/page_compiler
      MASTER_KEY: ${MASTER_KEY:?}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      PAGESPEED_API_KEY: ${PAGESPEED_API_KEY:-}
      SITES_YAML: ${SITES_YAML:-}
      CHROMIUM_CONCURRENCY: ${CHROMIUM_CONCURRENCY:-3}
      DEBOUNCE_MS: ${DEBOUNCE_MS:-30000}
      # Variante historique de SITES_YAML (« secret_env ») : mêmes lignes dans « worker ».
      SECRET_SITE_01: ${SECRET_SITE_01:-}
    # Même volume que le worker : l'interface affiche les captures des compilations.
    volumes:
      - artifacts:/app/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  worker:
    build: .
    command: ["node", "src/worker/start.js"]
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://page_compiler:${POSTGRES_PASSWORD:?}@postgres:5432/page_compiler
      MASTER_KEY: ${MASTER_KEY:?}
      SITES_YAML: ${SITES_YAML:-}
      CHROMIUM_CONCURRENCY: ${CHROMIUM_CONCURRENCY:-3}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-4}
      MEASURE_RUNS: ${MEASURE_RUNS:-3}
      NOISE_CHECK: ${NOISE_CHECK:-true}
      BASELINE_CHECK: ${BASELINE_CHECK:-true}
      SITE_RETRY_DELAY_MS: ${SITE_RETRY_DELAY_MS:-5000}
      VISUAL_THRESHOLD: ${VISUAL_THRESHOLD:-0.005}
      FULLPAGE_THRESHOLD: ${FULLPAGE_THRESHOLD:-0.01}
      HEIGHT_TOLERANCE: ${HEIGHT_TOLERANCE:-0.02}
      LCP_TOLERANCE: ${LCP_TOLERANCE:-1.05}
      NAVIGATION_MODE: ${NAVIGATION_MODE:-prefetch}
      PAGE_TIMEOUT_MS: ${PAGE_TIMEOUT_MS:-60000}
      ARTIFACTS_RETENTION_DAYS: ${ARTIFACTS_RETENTION_DAYS:-30}
      # Secrets des sites (mêmes lignes que dans « api ») :
      SECRET_SITE_01: ${SECRET_SITE_01:-}
    volumes:
      - artifacts:/app/data
    # Chromium a besoin d'une mémoire partagée suffisante.
    shm_size: "1gb"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 60s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
  artifacts:
